<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" role="img" aria-label="SEDA International Education 新加坡国际教育平台">
  <defs>
    <style>
      .logo-main { font-family: 'Inter', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
      .logo-cn { font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
    </style>
  </defs>
  <!-- SEDA wordmark -->
  <text x="0" y="48" class="logo-main" font-weight="900" font-size="56" fill="#c62828" letter-spacing="3">SEDA</text>
  <!-- Gold triangle accent on A -->
  <polygon points="218,10 225,22 211,22" fill="#c8a84e"/>
  <!-- Separator -->
  <line x1="252" y1="10" x2="252" y2="48" stroke="#d1d5db" stroke-width="1.2"/>
  <!-- INTERNATIONAL EDUCATION -->
  <text x="264" y="24" class="logo-main" font-weight="700" font-size="12.5" fill="#1a1a2e" letter-spacing="2.2">INTERNATIONAL</text>
  <text x="264" y="40" class="logo-main" font-weight="700" font-size="12.5" fill="#1a1a2e" letter-spacing="2.2">EDUCATION</text>
  <!-- Thin line -->
  <line x1="0" y1="58" x2="340" y2="58" stroke="#e5e7eb" stroke-width="0.8"/>
  <!-- Chinese name -->
  <text x="0" y="76" class="logo-cn" font-weight="500" font-size="15" fill="#6b7280">新加坡国际教育平台</text>
  <!-- Removed SINGAPORE EDUCATION PATHWAYS per brand decision -->
</svg>
