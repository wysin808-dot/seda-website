# SGEDA Nginx 配置 — 裸域为主域
# 放到: /etc/nginx/sites-available/sgeda
# 然后: ln -s /etc/nginx/sites-available/sgeda /etc/nginx/sites-enabled/sgeda

# HTTP 全部跳 HTTPS 裸域
server {
    listen 80;
    server_name sgeda.org.cn www.sgeda.org.cn;
    return 301 https://sgeda.org.cn$request_uri;
}

# HTTPS www → 裸域 301
server {
    listen 443 ssl http2;
    server_name www.sgeda.org.cn;
    ssl_certificate     /etc/letsencrypt/live/sgeda.org.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sgeda.org.cn/privkey.pem;
    return 301 https://sgeda.org.cn$request_uri;
}

# 主站：裸域
server {
    listen 443 ssl http2;
    server_name sgeda.org.cn;

    ssl_certificate     /etc/letsencrypt/live/sgeda.org.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sgeda.org.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/seda-website;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # 静态资源强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Legacy duplicate article URLs. Keep /news/ as the article list,
    # and redirect old /news/<slug>/ copies to their canonical topic paths.
    location = /news/aeis-math-preparation/ {
        return 301 /aeis/aeis-math-preparation/;
    }

    location = /news/student-pass-application-singapore/ {
        return 301 /guides/student-pass-application-singapore/;
    }

    location = /news/singapore-international-school-fees/ {
        return 301 /international-school/singapore-international-school-fees/;
    }

    location = /news/o-level-english-difficulty/ {
        return 301 /o-level/o-level-english-difficulty/;
    }

    location = /news/wace-apply-ntu-difficulty/ {
        return 301 /wace/wace-apply-ntu-difficulty/;
    }

    location = /news/wace-suitable-for-chinese-students/ {
        return 301 /wace/wace-suitable-for-chinese-students/;
    }

    # API 代理到 Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Clean URLs
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
