name: Deploy to Aliyun ECS

on:
  push:
    branches: ["main"]

concurrency:
  group: aliyun-ecs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy SEDA site on ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /var/www/sgeda

            # fetch does not change served bytes. The old production checkout may
            # not have the transaction helper yet: load it privately from origin/main.
            git fetch origin main
            DEPLOY_HELPER="$(mktemp /var/tmp/sgeda-deploy-helper.XXXXXX)"
            trap 'rm -f -- "$DEPLOY_HELPER"' EXIT
            git show origin/main:scripts/deploy-site-transaction.sh > "$DEPLOY_HELPER"
            source "$DEPLOY_HELPER"
            rm -f -- "$DEPLOY_HELPER"
            deploy_site_transaction_begin
            PREVIOUS_SHA="$DEPLOY_TX_PREVIOUS_SHA"
            CMS_BACKUP="$DEPLOY_TX_BACKUP/before"

            if [ -f .git/MERGE_HEAD ]; then git merge --abort; fi
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then git rebase --abort; fi
            git checkout -f main
            git reset --hard origin/main
            node scripts/restore-cms-content.mjs "$CMS_BACKUP" "$PREVIOUS_SHA"
            deploy_site_transaction_checkpoint_cms

            npm ci
            node scripts/build-content.mjs
            npm test
            # Final targets must exist, including each stable school fragment.
            node scripts/migrate-school-pages.mjs --validate-only
            node scripts/seo-check.mjs
            # Preserve live SSL/analytics/API config; test, prove loaded, then reload.
            deploy_site_transaction_install_redirects /var/www/sgeda/scripts/install-school-redirects.sh
            # Core generation is committed before optional submission/maintenance.
            deploy_site_transaction_commit
            node scripts/indexnow-submit.mjs || true
            bash scripts/install-daily-drafts-cron.sh
            bash scripts/install-seo-submit-cron.sh
            pm2 restart seda-api --update-env
            pm2 list

            echo "=== Report access configuration (no secret values) ==="
            pm2 jlist | node --input-type=module -e 'let input = ""; for await (const chunk of process.stdin) input += chunk; const app = JSON.parse(input).find(item => item.name === "seda-api"); const configured = Boolean(app?.pm2_env?.ANALYTICS_REPORT_TOKEN); console.log(JSON.stringify({ analyticsReportTokenConfigured: configured, reportAccess: configured ? "explicit-token" : "disabled" }));'

            echo "=== SEDA TLS certificate (read-only) ==="
            echo | timeout 15 openssl s_client -connect 127.0.0.1:443 -servername sgeda.org.cn 2>/dev/null | openssl x509 -noout -enddate
