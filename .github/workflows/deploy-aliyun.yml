name: Deploy to Aliyun ECS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: aliyun-ecs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy SEDA site on ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/sgeda

            PREVIOUS_SHA="$(git rev-parse HEAD)"
            CMS_BACKUP="/tmp/sgeda-cms-content-$(date +%Y%m%d%H%M%S)"
            mkdir -p "$CMS_BACKUP"
            if [ -d content/articles ]; then
              mkdir -p "$CMS_BACKUP/content"
              cp -a content/articles "$CMS_BACKUP/content/articles"
            fi
            if [ -f content/keyword-queue.csv ]; then
              mkdir -p "$CMS_BACKUP/content"
              cp -a content/keyword-queue.csv "$CMS_BACKUP/content/keyword-queue.csv"
            fi

            git fetch origin main
            git merge --abort || true
            git rebase --abort || true
            git checkout -f main
            git reset --hard origin/main
            node scripts/restore-cms-content.mjs "$CMS_BACKUP" "$PREVIOUS_SHA"

            npm ci
            npm test
            node scripts/build-content.mjs
            node scripts/seo-check.mjs
            node scripts/indexnow-submit.mjs || true
            bash scripts/install-daily-drafts-cron.sh
            bash scripts/install-seo-submit-cron.sh
            pm2 restart seda-api --update-env
            pm2 list

            echo "=== Report access configuration (no secret values) ==="
            pm2 jlist | node --input-type=module -e 'let input = ""; for await (const chunk of process.stdin) input += chunk; const app = JSON.parse(input).find(item => item.name === "seda-api"); const configured = Boolean(app?.pm2_env?.ANALYTICS_REPORT_TOKEN); console.log(JSON.stringify({ analyticsReportTokenConfigured: configured, reportAccess: configured ? "explicit-token" : "disabled" }));'

            echo "=== SEDA TLS certificate (read-only) ==="
            echo | timeout 15 openssl s_client -connect 127.0.0.1:443 -servername sgeda.org.cn 2>/dev/null | openssl x509 -noout -enddate
