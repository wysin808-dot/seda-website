# SEDA / SGEDA Nginx 配置
# 放到: /etc/nginx/sites-available/sgeda
# 然后: ln -s /etc/nginx/sites-available/sgeda /etc/nginx/sites-enabled/sgeda

server {
    listen 80;
    server_name sgeda.org.cn www.sgeda.org.cn;
    # HTTP 强制跳 HTTPS
    return 301 https://www.sgeda.org.cn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sgeda.org.cn;
    # 裸域 301 跳 www
    ssl_certificate     /etc/letsencrypt/live/sgeda.org.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sgeda.org.cn/privkey.pem;
    return 301 https://www.sgeda.org.cn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.sgeda.org.cn;

    # SSL 证书（certbot 自动生成）
    ssl_certificate     /etc/letsencrypt/live/sgeda.org.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sgeda.org.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 网站根目录（git clone 的位置）
    root /var/www/sgeda;
    index index.html;

    # Gzip 压缩（节省带宽）
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # 静态资源强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # CSS/JS 缓存
    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # API 请求代理到 Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # 所有路径尝试 .html 扩展（clean URLs）
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
