name: Deploy to Aliyun ECS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: aliyun-ecs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy SEDA site on ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_PORT }}
          script_stop: true
          script: |
            set -e
            cd /var/www/sgeda

            CMS_BACKUP="/tmp/sgeda-cms-content-$(date +%Y%m%d%H%M%S)"
            mkdir -p "$CMS_BACKUP"
            if [ -d content/articles ]; then
              mkdir -p "$CMS_BACKUP/content"
              cp -a content/articles "$CMS_BACKUP/content/articles"
            fi
            if [ -f content/keyword-queue.csv ]; then
              mkdir -p "$CMS_BACKUP/content"
              cp -a content/keyword-queue.csv "$CMS_BACKUP/content/keyword-queue.csv"
            fi

            git fetch origin main
            git merge --abort || true
            git rebase --abort || true
            git checkout -f main
            git reset --hard origin/main
            git clean -fd \
              -e .env \
              -e .env.local \
              -e data \
              -e data/** \
              -e .baidu-submit-offset \
              -e .indexnow-submit-offset \
              -e baidu-submit.log

            if [ -d "$CMS_BACKUP/content/articles" ]; then
              mkdir -p content/articles
              cp -a "$CMS_BACKUP/content/articles/." content/articles/
            fi
            if [ -f "$CMS_BACKUP/content/keyword-queue.csv" ]; then
              cp -a "$CMS_BACKUP/content/keyword-queue.csv" content/keyword-queue.csv
            fi

            node scripts/build-content.mjs
            node scripts/indexnow-submit.mjs || true
            bash scripts/install-daily-drafts-cron.sh
            bash scripts/install-seo-submit-cron.sh
            pm2 restart seda-api --update-env
            pm2 list

            echo "=== TLS cert renew check ==="
            {
              date
              (certbot renew --non-interactive 2>&1 || sudo -n certbot renew --non-interactive 2>&1 || echo "CERTBOT_RENEW_FAILED")
              (nginx -s reload 2>/dev/null || sudo -n systemctl reload nginx 2>/dev/null || sudo -n nginx -s reload 2>/dev/null || echo "NGINX_RELOAD_FAILED")
              echo "--- current cert on 443 ---"
              echo | openssl s_client -connect 127.0.0.1:443 -servername sgeda.org.cn 2>/dev/null | openssl x509 -noout -enddate
              echo "--- certbot timer status ---"
              (systemctl status certbot.timer 2>&1 | head -5 || true)
              (crontab -l 2>/dev/null | grep -i certbot || echo "no certbot crontab entry")
            } | tail -60 | tee /var/www/sgeda/cert-renew-latest.txt || true
