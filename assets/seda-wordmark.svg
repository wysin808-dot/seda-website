  <!-- English name -->
  <text x="214" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="400" font-size="11" fill="#6b7280" letter-spacing="0.3">SEDA International Education</text>
</svg>
