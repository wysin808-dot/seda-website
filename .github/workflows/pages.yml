name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rewrite paths for GitHub Pages sub-path
        run: |
          BASE="/seda-website"
          find . -name '*.html' -not -path './.git/*' | while read f; do
            sed -i \
              -e "s|href=\"/\"|href=\"${BASE}/\"|g" \
              -e "s|href=\"/\\([^\"]*\\)\"|href=\"${BASE}/\\1\"|g" \
              -e "s|src=\"/\\([^\"]*\\)\"|src=\"${BASE}/\\1\"|g" \
              -e "s|url(\"/\\([^\"]*\\)\")|url(\"${BASE}/\\1\")|g" \
              "$f"
          done
          echo "Path rewrite complete"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
