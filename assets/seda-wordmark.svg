<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 72">
  <!-- SEDA letters -->
  <g fill="none" stroke="#8b1a1a" stroke-width="8.5">
    <!-- S -->
    <path d="M 30,10 H 16 C 7,10 3,15 3,20 C 3,26 7,28 16,28 H 22 C 31,28 35,33 35,39 C 35,45 31,47 22,47 H 6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- E -->
    <path d="M 78,10 H 50 V 47 H 78" stroke-linejoin="miter"/>
    <line x1="50" y1="28" x2="73" y2="28"/>
    <!-- D -->
    <path d="M 94,47 V 10 H 110 C 124,10 130,18 130,28 C 130,38 124,47 110,47 Z" stroke-linejoin="miter"/>
    <!-- A (open top, no crossbar) -->
    <path d="M 145,47 L 161,10 L 177,47" stroke-linecap="butt"/>
  </g>
  <!-- Gold triangle accent on A -->
  <polygon fill="#c8a84e" points="161,13 168,24 154,24"/>

  <!-- Vertical divider -->
  <line x1="200" y1="6" x2="200" y2="66" stroke="#c8c8c8" stroke-width="1"/>

  <!-- Right side text block -->
  <!-- INTERNATIONAL -->
  <text x="218" y="23" font-family="'Times New Roman', 'Georgia', 'Noto Serif', serif" font-weight="400" font-size="19" fill="#8b1a1a" letter-spacing="5.5">INTERNATIONAL</text>
  <!-- EDUCATION -->
  <text x="218" y="44" font-family="'Times New Roman', 'Georgia', 'Noto Serif', serif" font-weight="400" font-size="19" fill="#8b1a1a" letter-spacing="5.5">EDUCATION</text>
  <!-- 新加坡国际教育平台 -->
  <text x="218" y="57" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif" font-weight="400" font-size="10" fill="#666" letter-spacing="1.5">新加坡国际教育平台</text>
  <!-- SINGAPORE EDUCATION PATHWAYS -->
  <text x="218" y="67" font-family="'Helvetica Neue', 'Arial', sans-serif" font-weight="300" font-size="8" fill="#999" letter-spacing="2">SINGAPORE EDUCATION PATHWAYS</text>
